[graph]
targets = []
all-features = false
no-default-features = false
exclude = ["bincode", "json"]

[advisories]
ignore = [
    # proc-macro-error2 (unmaintained) arrives via getset, which orchard 0.14
    # pins inside the zebra-rpc chain, so no local change can remove it from
    # the lock. Compile-time-only proc-macro, not runtime code. Remove this
    # entry once orchard/zebra drop getset upstream.
    { id = "RUSTSEC-2026-0173", reason = "getset -> proc-macro-error2 pinned by orchard 0.14; no upgrade path" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Deny openssl and boringssl dependencies
deny = [
    { crate = "openssl", reason = "Use rustls or other pure-Rust TLS implementations instead" },
    { crate = "openssl-sys", reason = "Use rustls or other pure-Rust TLS implementations instead" },
    { crate = "boring", reason = "Use rustls or other pure-Rust TLS implementations instead" },
    { crate = "boring-sys", reason = "Use rustls or other pure-Rust TLS implementations instead" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "ISC",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "MPL-2.0",
    "Zlib",
]
