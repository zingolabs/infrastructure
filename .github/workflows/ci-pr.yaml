name: CI - PR

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - '**'
  pull_request:

jobs:
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  external-types:
    name: External Types (public API)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup pinned nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-10-18

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install cargo-check-external-types
        # Pinned to match PINNED_NIGHTLY (nightly-2025-10-18, rustdoc JSON
        # format 56). 0.5.0 requires format 57; bump both together.
        run: cargo binstall cargo-check-external-types@0.4.0 -y --force

      - name: Run checks
        run: just check-external-types

  reject-trailing-whitespace:
    uses: ./.github/workflows/trailing-whitespace.yaml

  cargo-shear:
    name: Cargo Shear
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo-shear
        uses: ./.github/actions/cargo-shear

  cargo-checkmate:
    uses: ./.github/workflows/cargo-checkmate.yaml

  cargo-hack-check:
    name: Cargo Hack Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo-hack
        uses: ./.github/actions/cargo-hack
        with:
          hack-subcommand: check

  test:
    uses: ./.github/workflows/test.yaml
