name: CI - Nightly

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  reject-trailing-whitespace:
    uses: ./.github/workflows/trailing-whitespace.yaml

  cargo-shear:
    uses: ./.github/workflows/cargo-shear.yaml

  cargo-checkmate:
    uses: ./.github/workflows/cargo-checkmate.yaml

  cargo-hack-build:
    uses: ./.github/workflows/cargo-hack.yaml
    with:
      hack-subcommand: build
