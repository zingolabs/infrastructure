name: Cargo Checkmate
description: Run cargo-checkmate to check Rust code quality

inputs:
  toolchain:
    description: Rust toolchain to use
    required: false
    default: stable
  rustflags:
    description: RUSTFLAGS passed via env
    required: false
    default: "-D warnings"
  phase:
    description: Checkmate phase to run (build, check, clippy, doc, format)
    required: true
  doc-all-features:
    description: Run cargo doc with --all-features instead of cargo-checkmate doc
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install cargo-checkmate
      uses: taiki-e/cache-cargo-install-action@v2
      with:
        tool: cargo-checkmate

    - name: Run cargo checkmate
      shell: bash
      env:
        RUSTFLAGS: ${{ inputs.rustflags }}
      run: |
        if [ "${{ inputs.phase }}" = "doc" ] && [ "${{ inputs.doc-all-features }}" = "true" ]; then
          RUSTDOCFLAGS="-D warnings" cargo doc --all-features --document-private-items
        else
          cargo-checkmate run ${{ inputs.phase }}
        fi
