[package]
name = "zcash_local_net"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Utilities for launching and managing local Zcash processes (zebrad, zcashd, zainod, lightwalletd) for integration testing."
authors = ["Zingolabs <zingo@zingolabs.org>"]
repository = "https://github.com/zingolabs/infrastructure"
homepage = "https://github.com/zingolabs/infrastructure"

[badges]
github = { repository = "zingolabs/infrastructure/services" }

[dependencies]

# zingo
zingo-consensus = { workspace = true }
zingo_test_vectors = { workspace = true }
zebra-rpc = { workspace = true }

# Community
tempfile = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
getset = { workspace = true }
json = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
serde = "1.0"
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
tracing-subscriber = { workspace = true }

[build-dependencies]
hex = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs", "rt-multi-thread"] }

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "tempfile::dir::TempDir",
    "zingo_consensus::ActivationHeights",
    "zingo_consensus::ActivationHeightsBuilder",
    "zingo_consensus::MinerPool",
    "zingo_consensus::NetworkType",
    "reqwest::error::Error",
]
