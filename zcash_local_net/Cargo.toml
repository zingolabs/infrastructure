[package]
name = "zcash_local_net"
version = "0.5.0"
edition = "2021"
license = "MIT"

[badges]
github = { repository = "zingolabs/infrastructure/services" }

[dependencies]

# zingo
zingo_common_components = { workspace = true }
zingo_test_vectors = { workspace = true }

# zcash
zcash_protocol = { version = "0.7", features = ["local-consensus"] }

# zebra
zebra-node-services = { workspace = true }
zebra-rpc = { workspace = true }
zebra-chain = { workspace = true }

# Community
tempfile = { workspace = true }
portpicker = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
getset = { workspace = true }
json = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[build-dependencies]
hex = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs", "rt-multi-thread"] }

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "tempfile::dir::TempDir",
    "zcash_protocol::PoolType",
    "zingo_common_components::protocol::ActivationHeights",
    "zingo_common_components::protocol::NetworkType",
    "zebra_node_services::rpc_client::RpcRequestClient",
]
