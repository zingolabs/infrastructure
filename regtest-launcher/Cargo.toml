[package]
name = "regtest-launcher"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Launch a local Zcash regtest network (zebrad + zainod) and continuously mine blocks. Built on zcash_local_net."
authors = ["Zingolabs <zingo@zingolabs.org>"]
repository = "https://github.com/zingolabs/infrastructure"
homepage = "https://github.com/zingolabs/infrastructure"

[dependencies]
bip0039.workspace = true
clap = { version = "4.5.53", features = ["derive"] }
hex.workspace = true
local-net = { path = "../zcash_local_net", package = "zcash_local_net" }
owo-colors = "4.2.3"
ripemd = "0.1.3"
secp256k1 = "0.29.1"
sha2 = "0.10.9"
tokio = { workspace = true, features = ["signal"] }
# Ironwood: versions bumped to match the zingolabs/librustzcash feat/ironwood
# fork (patched in at the workspace root) so a single orchard 0.15.0-pre.1
# resolves across the graph. Without these bumps the [patch.crates-io] entries
# would not satisfy these requirements and crates.io copies would leak back in.
zcash_keys = "0.14.0"
zcash_protocol = "0.9.0"
zcash_transparent = { version = "0.8.0", features = ["transparent-inputs"] }
zebra-node-services = { workspace = true, features = ["rpc-client"] }
zebra-rpc.workspace = true
zip32 = "0.2.1"
zingo_common_components = { workspace = true }

[dev-dependencies]
anyhow = "1.0.100"
assert_cmd = "2.1.1"
insta = "1.44.3"
nix = { version = "0.30.1", features = ["signal", "process"] }
regex = "1.12.2"
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "time",
    "io-util",
    "process",
] }
