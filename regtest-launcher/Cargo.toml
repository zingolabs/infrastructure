[package]
name = "regtest-launcher"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Launch a local Zcash regtest network (zebrad + zainod) and continuously mine blocks, with a built-in faucet. Built on zcash_local_net."
authors = ["Zingolabs <zingo@zingolabs.org>"]
repository = "https://github.com/zingolabs/infrastructure"
homepage = "https://github.com/zingolabs/infrastructure"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
local-net = { path = "../zcash_local_net", package = "zcash_local_net" }
owo-colors = "4.2.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }

# Faucet (regtest-launcher only). Mining goes through the zebra-free
# `local_net::zebra_rpc::submit_template_block` helper, so the launcher needs
# no zebra crates for that; the deps below exist solely to build V6 Ironwood
# faucet transactions. `zebra-node-services` provides the JSON-RPC client the
# faucet uses to query UTXOs and broadcast; the orchard/librustzcash crates are
# pinned to versions the workspace-root [patch.crates-io] fork stack satisfies,
# so a single orchard 0.15.0-pre.1 resolves across the graph.
axum = "0.7.9"
bip0039 = "0.12.0"
bls12_381 = "0.8"
hex.workspace = true
jubjub = "0.10"
rand = "0.8"
rand_core = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
ripemd = "0.1.3"
secp256k1 = "0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10.9"
orchard = "0.15.0-pre.1"
sapling = { package = "sapling-crypto", version = "0.7.0" }
zcash_keys = { version = "0.15.0-pre.0", features = ["orchard", "sapling"] }
zcash_primitives = { version = "0.29.0-pre.0", features = [
    "transparent-inputs",
] }
zcash_protocol = { version = "0.10.0-pre.0", features = ["local-consensus"] }
zcash_transparent = { version = "0.9.0-pre.0", features = [
    "transparent-inputs",
] }
zebra-node-services = { version = "7.0.0", features = ["rpc-client"] }
zip32 = "0.2.1"

[lints.rust]
# Ironwood (NU6.3) code paths are gated behind `--cfg zcash_unstable=...`,
# set for every build in this repo via `.cargo/config.toml`. Declare the known
# values so first-party `#[cfg(zcash_unstable = ...)]` uses don't warn.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(zcash_unstable, values("nu6.3", "nu7", "zfuture"))',
] }

[dev-dependencies]
anyhow = "1.0.100"
nix = { version = "0.30.1", features = ["signal", "process"] }
regex = "1.12.2"
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "time",
    "io-util",
    "process",
] }
