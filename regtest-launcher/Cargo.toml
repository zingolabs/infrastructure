[package]
name = "regtest-launcher"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Launch a local Zcash regtest network (zebrad + lightwalletd) and continuously mine blocks. Built on zcash_local_net."
authors = ["Zingolabs <zingo@zingolabs.org>"]
repository = "https://github.com/zingolabs/infrastructure"
homepage = "https://github.com/zingolabs/infrastructure"

[dependencies]
axum = "0.7.9"
bip0039.workspace = true
bls12_381 = "0.8"
clap = { version = "4.5.53", features = ["derive"] }
hex.workspace = true
jubjub = "0.10"
local-net = { path = "../zcash_local_net", package = "zcash_local_net" }
owo-colors = "4.2.3"
rand = "0.8"
rand_core = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
ripemd = "0.1.3"
secp256k1 = "0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10.9"
tokio = { workspace = true, features = ["signal", "macros", "rt-multi-thread"] }
# Ironwood: versions bumped to match the zingolabs/librustzcash feat/ironwood
# fork (patched in at the workspace root) so a single orchard 0.15.0-pre.1
# resolves across the graph. Without these bumps the [patch.crates-io] entries
# would not satisfy these requirements and crates.io copies would leak back in.
orchard = "0.15.0-pre.1"
sapling = { package = "sapling-crypto", version = "0.7.0" }
zcash_keys = { version = "0.15.0-pre.0", features = ["orchard", "sapling"] }
zcash_primitives = { version = "0.29.0-pre.0", features = [
    "transparent-inputs",
] }
zcash_protocol = { version = "0.10.0-pre.0", features = ["local-consensus"] }
zcash_transparent = { version = "0.9.0-pre.0", features = [
    "transparent-inputs",
] }
zebra-node-services = { workspace = true, features = ["rpc-client"] }
zebra-rpc.workspace = true
zip32 = "0.2.1"
zingo_common_components = { workspace = true }

[lints.rust]
# Ironwood (NU6.3) code paths are gated behind `--cfg zcash_unstable=...`,
# set for every build in this repo via `.cargo/config.toml`. Declare the known
# values so first-party `#[cfg(zcash_unstable = ...)]` uses don't warn.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(zcash_unstable, values("nu6.3", "nu7", "zfuture"))',
] }

[dev-dependencies]
anyhow = "1.0.100"
assert_cmd = "2.1.1"
insta = "1.44.3"
nix = { version = "0.30.1", features = ["signal", "process"] }
regex = "1.12.2"
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "time",
    "io-util",
    "process",
] }
