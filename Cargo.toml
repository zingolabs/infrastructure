[workspace]
members = ["services"]
resolver = "2"

[workspace.dependencies]
getset = "0.1.3"
hex = "0.4.3"
http = "1.1.0"
json = "0.12.4"
portpicker = "0.1.1"
reqwest = "0.12.11"
serde_json = "1.0.132"
sha2 = "0.10.8"
tempfile = "3.13.0"
thiserror = "1.0.64"
tokio = "1.42.0"
tokio-stream = "0.1.16"
tonic = "0.12.3"
tracing = "0.1.40"
tracing-subscriber = "0.3.15"

zcash_primitives = { version = "0.24" }
zcash_protocol = { version = "=0.6.1", features = [
  "local-consensus",
] }

zebra-chain = "2.0"
zebra-node-services = "1.0"
zebra-rpc = "2.0"
