[workspace]
members = ["zcash_local_net", "zingo_test_vectors"]
resolver = "2"

[workspace.dependencies]


http = "1.1.0"


getset = "0.1.3"
hex = "0.4.3"
json = "0.12.4"
portpicker = "0.1.1"
serde_json = "1.0.132"
tempfile = "3.13.0"
thiserror = "1.0.64"
tokio = "1.42.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.15"
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b", features = [
  "local-consensus",
] }

zebra-chain = "2.0"
zebra-node-services = "1.0"
zebra-rpc = "2.0"
