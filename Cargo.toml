[workspace]
members = [
    "zcash_local_net",
    "zingo-consensus",
    "zingo_test_vectors",
    "regtest-launcher",
]
resolver = "2"

[workspace.dependencies]

# workspace
zingo_test_vectors = { path = "zingo_test_vectors" }
zingo-consensus = { path = "zingo-consensus" }
hex = "0.4.3"
reqwest = { version = "0.12", default-features = false }
serde_json = "1.0.132"
tempfile = "3.13.0"
thiserror = "1.0.64"
tokio = "1.42.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.15"

[profile.dev.package]
insta.opt-level = 3
