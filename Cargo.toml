[workspace]
members = ["services", "zingo_common_components", "zingo_netutils"]
resolver = "2"

[workspace.dependencies]


http = "1.1.0"
http-body-util = "0.1"
http-body = "1"
hyper-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["http2"] }
prost = "0.13"
tokio-rustls = "0.26"
tonic = { version = "0.12", features = [
    "tls",
    "tls-roots",
    "tls-webpki-roots",
] }
tower = { version = "0.5" }
webpki-roots = "0.25"

rustls-pemfile = "2"


getset = "0.1.3"
hex = "0.4.3"
json = "0.12.4"
portpicker = "0.1.1"
reqwest = "0.12.11"
serde_json = "1.0.132"
sha2 = "0.10.8"
tempfile = "3.13.0"
thiserror = "1.0.64"
tokio = "1.42.0"
tokio-stream = "0.1.16"
tracing = "0.1.40"
tracing-subscriber = "0.3.15"

zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b", features = [
  "local-consensus",
] }

zebra-chain = "2.0"
zebra-node-services = "1.0"
zebra-rpc = "2.0"
