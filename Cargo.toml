[workspace]
members = ["zcash_local_net", "zingo_test_vectors", "regtest-launcher"]
resolver = "2"

[workspace.dependencies]

# workspace
zingo_test_vectors = { path = "zingo_test_vectors" }
zcash_local_net = { path = "zcash_local_net" }

# zingo-common
zingo_common_components = "0.3.0"

# zebra
zebra-chain = "6.0.2"
zebra-node-services = "4.0.0"
zebra-rpc = "6.0.2"

# other
getset = "0.1.3"
hex = "0.4.3"
json = "0.12.4"
reqwest = { version = "0.12", default-features = false }
serde_json = "1.0.132"
tempfile = "3.13.0"
thiserror = "1.0.64"
tokio = "1.42.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.15"

[profile.dev.package]
insta.opt-level = 3

[patch.crates-io]
libzcash_script = { git = "https://github.com/zancas/zcash_script", branch = "fix-bindgen-rust-target" }
