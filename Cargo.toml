[workspace]
members = ["services", "zingo_common_components", "zingo_netutils"]
resolver = "2"

[workspace.dependencies]
getset = "0.1.3"
hex = "0.4.3"
http = "1.1.0"
json = "0.12.4"
portpicker = "0.1.1"
reqwest = "0.12.11"
serde_json = "1.0.132"
sha2 = "0.10.8"
tempfile = "3.13.0"
thiserror = "1.0.64"
tokio = "1.42.0"
tokio-stream = "0.1.16"
tonic = "0.12.3"
tracing = "0.1.40"
tracing-subscriber = "0.3.15"

zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b", features = [
  "local-consensus",
] }

zebra-chain = "2.0"
zebra-node-services = "1.0"
zebra-rpc = "2.0"
