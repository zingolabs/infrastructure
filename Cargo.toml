[workspace]
members = ["services", "testutils"]
default-members = ["services"]
resolver = "2"

[workspace.dependencies]
getset = "0.1.3"
hex = "0.4.3"
http = "1.1.0"
json = "0.12.4"
portpicker = "0.1.1"
reqwest = "0.12.11"
serde_json = "1.0.132"
sha2 = "0.10.8"
tempfile = "3.13.0"
thiserror = "1.0.64"
tokio = "1.42.0"
tokio-stream = "0.1.16"
tonic = "0.12.2"
tracing = "0.1.40"
tracing-subscriber = "0.3.15"

zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b", features = [
  "lightwalletd-tonic",
  "orchard",
  "transparent-inputs",
] }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b" }

zebra-chain = { git = "https://github.com/ZcashFoundation/zebra.git", rev = "0893e1a7f499cadad1d9480216b3057dfd7900c7" }
zebra-node-services = { git = "https://github.com/ZcashFoundation/zebra.git", rev = "0893e1a7f499cadad1d9480216b3057dfd7900c7" }
zebra-rpc = { git = "https://github.com/ZcashFoundation/zebra.git", rev = "0893e1a7f499cadad1d9480216b3057dfd7900c7" }

zingo-netutils = { git = "https://github.com/zingolabs/zingolib.git", tag = "2.0.0-beta2" }
zingolib = { git = "https://github.com/zingolabs/zingolib.git", tag = "2.0.0-beta2" }
testvectors = { git = "https://github.com/zingolabs/zingolib.git", tag = "2.0.0-beta2" }

zingo-infra-services = { path = "services" }
