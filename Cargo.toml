[workspace]
members = ["zcash_local_net", "zingo_test_vectors", "regtest-launcher"]
resolver = "2"

[workspace.dependencies]

# workspace
zingo_test_vectors = { path = "zingo_test_vectors" }
zcash_local_net = { path = "zcash_local_net" }

# zingo-common
zingo_common_components = "0.4.0"

#zcash
zcash_protocol = { version = "0.10.0-pre.0", features = ["local-consensus"] }

# zebra
zebra-chain = "9.0.0"
zebra-node-services = "7.0.0"
zebra-rpc = "9.0.0"

#protocol
bip0039 = "0.12.0"

# other
getset = "0.1.3"
hex = "0.4.3"
json = "0.12.4"
reqwest = { version = "0.12", default-features = false }
serde_json = "1.0.132"
tempfile = "3.13.0"
thiserror = "1.0.64"
tokio = "1.42.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.15"

[profile.dev.package]
insta.opt-level = 3

[patch.crates-io]
libzcash_script = { git = "https://github.com/zancas/zcash_script", branch = "fix-bindgen-rust-target" }

# Ironwood (NU6.3) — zebra. Point zebra at the zingolabs Ironwood fork (ZIN-37,
# the add-ironwood-v6-value-pool work), built against orchard 0.15.0-pre.1 and
# `--cfg zcash_unstable="nu6.3"`. This is what removes the orchard 0.14/0.15
# split: zebra-chain 9.0.0 from crates.io pins orchard 0.14, which clashes with
# the librustzcash Ironwood stack below. We only need to patch the three crates
# this workspace names directly; their intra-workspace `path` deps
# (zebra-consensus, zebra-state, zebra-network, …, which also pull orchard)
# resolve from the same fork checkout, so the whole zebra subtree moves to
# orchard 0.15.0-pre.1.
zebra-chain = { git = "https://github.com/zingolabs/zebra", branch = "feat/ironwood" }
zebra-rpc = { git = "https://github.com/zingolabs/zebra", branch = "feat/ironwood" }
zebra-node-services = { git = "https://github.com/zingolabs/zebra", branch = "feat/ironwood" }
